name: Fetch Subscriptions Source

# 触发条件
on:
  workflow_dispatch:

  push:
    paths:
      - 'main.py'
      - 'merge_clash.py'
      - 'test_clash.py'
      - 'config.yaml'
      - 'requirements.txt'
      - '.github/workflows/fetch.yaml'

  schedule:
    - cron: '0 */12 * * *'
  # - cron: '0 3,12 * * *'
  # 表达式生成  https://crontab.guru/

 
jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: collect-subscriptions
      cancel-in-progress: false
    steps:

    - name: 迁出代码
      uses: actions/checkout@v6

    - name: 安装Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        cache: pip
        cache-dependency-path: requirements.txt
      
    - name: 设置时区
      run: sudo timedatectl set-timezone 'Asia/Shanghai'

    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r ./requirements.txt
    - name: 执行任务
      run: |
        python ./main.py

    - name: 下载 Mihomo 核心
      run: |
        mkdir -p .runtime
        MIHOMO_URL=$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -r '.assets[] | select(.name | test("mihomo-linux-amd64-v1-v.*\\.gz$")) | .browser_download_url' | head -n 1)
        test -n "$MIHOMO_URL"
        curl -fsSL "$MIHOMO_URL" | gzip -d > .runtime/mihomo
        chmod +x .runtime/mihomo

    - name: 测试节点并生成可用订阅
      run: |
        python -c "import yaml; p='sub/merged.yaml'; d=yaml.safe_load(open(p, encoding='utf-8')); d['external-controller']='127.0.0.1:19090'; yaml.safe_dump(d, open('.runtime/config.yaml','w',encoding='utf-8'), allow_unicode=True, sort_keys=False)"
        .runtime/mihomo -d .runtime -f .runtime/config.yaml > .runtime/mihomo.log 2>&1 &
        MIHOMO_PID=$!
        trap 'kill "$MIHOMO_PID" || true' EXIT
        python ./test_clash.py --input sub/merged.yaml --output sub/merged-tested.yaml
    - name: Commit
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"

        git add ./sub
        git diff --cached --quiet || git commit -m "🍀 爬取订阅源 $(date '+%Y-%m-%d %H:%M:%S')"
        
    - name: 推送更改
      run: git push origin HEAD:main
